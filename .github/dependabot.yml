version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # "chore(deps): ..." / "chore(deps-dev): ...", so the titles pass the
    # `PR title` check instead of depending on Dependabot's inference.
    commit-message:
      prefix: chore
      include: scope
    # Hold new releases for a week before proposing them, so a compromised PyPI
    # publish has time to be caught and yanked. Security updates bypass this.
    cooldown:
      default-days: 7
    groups:
      production-dependencies:
        dependency-type: production
        update-types: ["minor", "patch"]
      development-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Same rationale as the uv ecosystem above.
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]
