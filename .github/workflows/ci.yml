name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A re-pushed PR supersedes its own run; a push to main is never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint, types, the changelog config, unit, script and contract tests (against
  # the fake gateway) and the build. The real-gateway contract runs are decdn's
  # e2e harness.
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # Parses cliff.toml and renders the unreleased section.
      - run: uv run git-cliff --unreleased --strip all
      - run: uv run pytest
      - run: uv build

  # Coverage of src/decdn ([tool.coverage] in pyproject.toml), posted to GitHub
  # Code Quality, which comments the PR coverage and per-file deltas against
  # main. The upload is attributed to the PR's head commit, so the report is
  # made from that commit, not the merge commit the other jobs test.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # `Upload code coverage` posts the Cobertura report to GitHub Code Quality.
      code-quality: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest --cov --cov-report=term --cov-report=xml
      # Best-effort: a failure never blocks the PR. The action skips fork PRs
      # by itself (their token is read-only).
      - name: Upload code coverage
        if: hashFiles('coverage.xml') != ''
        continue-on-error: true
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage.xml
          language: Python
          label: code-coverage/pytest-cov
          fail-on-error: false

  # The tests on the lowest versions pyproject.toml allows of each direct
  # dependency, on the lowest Python: the floors hold. uv sync and uv run both
  # read UV_RESOLUTION, so neither re-locks to the highest.
  test-lowest:
    name: test (lowest direct dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_RESOLUTION: lowest-direct
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync
      - run: uv run pytest

  # The package as PyPI would ship it: twine check and the wheel's contents.
  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - run: scripts/check-package.sh

  # The workflows and the shell scripts.
  lint-ci:
    name: lint (workflows, scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false
      # The token turns on zizmor's online audits (known-vulnerable actions).
      # Its policy for action refs is in zizmor.yml.
      - run: uvx zizmor --format=github .github
        env:
          GH_TOKEN: ${{ github.token }}
      - run: shellcheck scripts/*.sh

  # The single required check.
  ci-success:
    name: CI success
    if: always()
    needs: [test, coverage, test-lowest, package, lint-ci]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
