name: Publish

# Publishes `decdn` to PyPI from a signed release tag, then makes the tag's
# GitHub release. scripts/publish.sh dispatches this workflow on `main` with the
# tag as its input, using the maintainer's own `gh` login, after
# scripts/release.sh has pushed the signed tag (RELEASING.md).
#
# No PyPI token is stored anywhere. PyPI Trusted Publishing trusts this file,
# by name, in decdn/sdk-python, run in the `release` environment. The `publish`
# job trades the job's GitHub OIDC token for a short-lived PyPI token, and its
# upload carries PEP 740 attestations made from that same identity.
#
# The checks below hold only if the workflow that runs them is the reviewed one,
# so nothing a tag carries runs with the token in reach:
# - The `release` environment allows deployments from `main` only. A run from
#   a tag or another branch, which runs that ref's copy of this file, never
#   gets the token. PyPI matches the workflow by file name and environment, not
#   by ref, so the environment is what holds this.
# - This file, KEYS and scripts/prepare-publish.sh come from the `main` commit
#   the run started on, checked out at the workspace root. The tag is checked
#   out at `src/` and built, never trusted.
# `main` is protected by the `Protect defaults` ruleset; org admins bypass it.
#
# Three jobs, because `id-token: write` lets every step in its job request an
# OIDC token, and so a PyPI token. `prepare` runs the tag's code — the gate and
# the build — with no OIDC access. `publish` holds `id-token: write` and only
# uploads what `prepare` built. `github-release` holds `contents: write` and
# only makes the release.
#
# A PyPI file can never be uploaded again, even after a delete, so nothing is
# uploaded until the tag carries a signature by a key in KEYS on main, the
# version agrees across the tag, pyproject.toml and src/decdn/_version.py, the
# gate and the build pass, and no draft release exists for the tag.
#
# Re-running is safe. The upload skips the files PyPI already has, and
# `github-release` is skipped once the release exists, so a run that failed
# partway finishes the remainder when it is dispatched again.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v0.1.0
        required: true
        type: string
      dry_run:
        description: Check and build only; upload and release nothing
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# One group per tag. GitHub keeps one pending run per group and cancels the
# older pending run when another queues, so a group shared by every tag could
# drop a different release's run.
concurrency:
  group: publish-${{ inputs.tag }}
  # Never cancel a run in progress: a cancelled upload can leave one file of
  # the version published. A queued run uploads whatever the first one left.
  cancel-in-progress: false

jobs:
  prepare:
    name: Check and build the signed tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      prerelease: ${{ steps.prepare.outputs.prerelease }}
      pending: ${{ steps.prepare.outputs.pending }}
      has_release: ${{ steps.prepare.outputs.has_release }}
    steps:
      # `publish` would refuse the environment anyway. Failing here says why
      # before any work is done.
      - name: Require a run from main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::dispatch this workflow on main (got $GITHUB_REF):" \
                 "gh workflow run publish.yml --ref main -f tag=<tag>"
            exit 1
          fi

      # The tag names a checkout ref below, so its form is checked first: the
      # PEP 440 rule prepare-publish.sh applies again.
      - name: Check the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          pep440='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)((a|b|rc)(0|[1-9][0-9]*))?(\.dev(0|[1-9][0-9]*))?'
          if ! [[ "$TAG" =~ ^v${pep440}$ ]]; then
            echo "::error::'$TAG' is not a release tag (v<major>.<minor>.<patch>[{a|b|rc}<n>][.dev<n>])"
            exit 1
          fi

      # The trusted tree: this workflow's own commit on main.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The tag's tree, built but never trusted. Full fetch: `git verify-tag`
      # needs the annotated tag object.
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: src
          fetch-depth: 0
          persist-credentials: false

      # No cache: a release build restores nothing another run could have
      # written.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: false

      # KEYS comes from main, NOT from the tagged tree: a tag that carried its
      # own KEYS would vouch for itself. The tag reaches the script through
      # `env`, never inlined into it.
      - name: Check and build ${{ inputs.tag }}
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          OUT: ${{ runner.temp }}/out
        run: |
          scripts/prepare-publish.sh "$TAG" src KEYS "$OUT"
          cat "$OUT/outputs" >> "$GITHUB_OUTPUT"

      - name: Summarise
        env:
          TAG: ${{ inputs.tag }}
          OUT: ${{ runner.temp }}/out
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "### decdn $TAG"
            echo
            echo '```'
            cat "$OUT/outputs"
            echo '```'
            if [ "$DRY_RUN" = true ]; then
              echo
              echo "Dry run: nothing is uploaded or released."
            fi
            echo
            echo "#### Release notes"
            echo
            cat "$OUT/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            ${{ runner.temp }}/out/dist
            ${{ runner.temp }}/out/notes.md
          if-no-files-found: error
          # Long enough to re-run `publish` or `github-release` alone after a
          # failure. Re-running every job always works: `prepare` builds again.
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: prepare
    if: ${{ !inputs.dry_run && needs.prepare.outputs.pending == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PyPI trusts this environment name, and the environment allows
    # deployments from `main` only.
    environment:
      name: release
      url: https://pypi.org/project/decdn/${{ needs.prepare.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      # skip-existing: a file PyPI already has is left alone, so a re-run
      # uploads only what a failed run did not.
      - uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          packages-dir: release/dist/
          skip-existing: true

  github-release:
    name: Make the GitHub release
    needs: [prepare, publish]
    # After an upload, or when PyPI already had every file (`publish` skipped),
    # but never after a failed upload.
    if: >-
      ${{ always() && !inputs.dry_run
      && needs.prepare.result == 'success'
      && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
      && needs.prepare.outputs.has_release != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          args=(release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag
                --title "$TAG" --notes-file release/notes.md)
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease --latest=false)
          fi
          gh "${args[@]}"
